<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 数字人 · 语音交互</title>
    <style>
        /* ========== 样式（与之前一致，无修改） ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #141829;
            --bg-card: rgba(255,255,255,0.04);
            --border-glow: rgba(120,80,255,0.25);
            --text-primary: #f0ecff;
            --text-secondary: #a8a0c8;
            --accent-purple: #7c5cfc;
            --accent-blue: #4a9eff;
            --accent-pink: #e060b0;
            --shadow-glow: 0 0 40px rgba(124,92,252,0.15);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(ellipse at 20% 50%, rgba(124,92,252,0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(74,158,255,0.05) 0%, transparent 60%);
        }
        .app {
            width: 1300px;
            max-width: 100%;
            height: 90vh;
            max-height: 860px;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glow), inset 0 1px 0 rgba(255,255,255,0.04);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
            position: relative;
        }
        .header {
            padding: 18px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            flex-shrink: 0;
            background: rgba(255,255,255,0.02);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo { font-size: 24px; line-height: 1; }
        .header-title {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-status {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
        .status-dot.offline { background: #f87171; animation: none; }
        @keyframes pulse-dot {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }
        .header-actions { display: flex; gap: 10px; }
        .btn-icon {
            background: rgba(255,255,255,0.06);
            border: none;
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }
        .btn-icon.active { background: rgba(124,92,252,0.2); color: var(--accent-purple); }

        .main { display: flex; flex: 1; min-height: 0; }

        .avatar-panel {
            width: 320px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: radial-gradient(ellipse at center, rgba(124,92,252,0.05) 0%, transparent 70%);
            border-right: 1px solid rgba(255,255,255,0.04);
            position: relative;
            overflow: hidden;
        }
        .avatar-panel::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(ellipse at center, rgba(124,92,252,0.03) 0%, transparent 60%);
            animation: rotate-glow 30s linear infinite;
            pointer-events: none;
        }
        @keyframes rotate-glow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .avatar-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-placeholder {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(124,92,252,0.15), rgba(74,158,255,0.10));
            border: 2px solid rgba(124,92,252,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 72px;
            position: relative;
            transition: var(--transition);
            box-shadow: 0 0 60px rgba(124,92,252,0.08);
            user-select: none;
        }
        .avatar-placeholder .emoji { filter: drop-shadow(0 0 20px rgba(124,92,252,0.2)); transition: var(--transition); }
        .avatar-placeholder.breathe { animation: breathe 3s ease-in-out infinite; }
        @keyframes breathe {
            0%,100% { transform: scale(1); box-shadow: 0 0 60px rgba(124,92,252,0.08); }
            50% { transform: scale(1.04); box-shadow: 0 0 80px rgba(124,92,252,0.18); }
        }
        .avatar-placeholder.speaking {
            animation: speak-glow 0.8s ease-in-out infinite alternate;
            border-color: rgba(124,92,252,0.5);
        }
        @keyframes speak-glow {
            0% { box-shadow: 0 0 40px rgba(124,92,252,0.1), inset 0 0 40px rgba(124,92,252,0.02); transform: scale(1); }
            100% { box-shadow: 0 0 80px rgba(124,92,252,0.25), inset 0 0 60px rgba(124,92,252,0.06); transform: scale(1.02); }
        }
        .avatar-placeholder.thinking {
            animation: think-pulse 1.2s ease-in-out infinite;
            border-color: rgba(74,158,255,0.4);
        }
        @keyframes think-pulse {
            0%,100% { box-shadow: 0 0 40px rgba(74,158,255,0.08); }
            50% { box-shadow: 0 0 70px rgba(74,158,255,0.2); }
        }
        .avatar-ring {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 1px solid rgba(124,92,252,0.08);
            animation: ring-spin 12s linear infinite;
            pointer-events: none;
        }
        .avatar-ring:nth-child(2) {
            inset: -24px;
            border-color: rgba(74,158,255,0.05);
            animation-duration: 18s;
            animation-direction: reverse;
        }
        @keyframes ring-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .avatar-status {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(255,255,255,0.04);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.04);
            letter-spacing: 0.3px;
        }
        .avatar-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4ade80;
            display: inline-block;
            transition: var(--transition);
        }
        .avatar-status .dot.inactive { background: #f87171; }
        .avatar-status .dot.thinking-dot { background: #fbbf24; animation: pulse-dot 0.8s infinite; }
        .avatar-status .dot.speaking-dot { background: #4ade80; animation: pulse-dot 0.4s infinite; }
        .avatar-name {
            margin-top: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.5;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: rgba(255,255,255,0.01);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 28px 8px 28px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            position: relative;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-track { background: transparent; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(124,92,252,0.3); border-radius: 10px; }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: msg-in 0.35s ease-out;
            position: relative;
        }
        @keyframes msg-in {
            0% { opacity: 0; transform: translateY(12px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }

        .message-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            user-select: none;
        }
        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border: none;
        }
        .message.assistant .message-avatar {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(124,92,252,0.15);
        }

        .message-bubble {
            padding: 12px 18px;
            border-radius: var(--radius-md);
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            position: relative;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--accent-purple), #6b4ce0);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .message-bubble {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
            border-bottom-left-radius: 4px;
            backdrop-filter: blur(4px);
        }
        .message-bubble .time {
            font-size: 11px;
            opacity: 0.4;
            margin-top: 6px;
            display: block;
            text-align: right;
            letter-spacing: 0.3px;
        }
        .message.assistant .message-bubble .time { color: var(--text-secondary); }
        .message.user .message-bubble .time { color: rgba(255,255,255,0.5); }

        .message-read-btn {
            position: absolute;
            bottom: -6px;
            right: -6px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(124,92,252,0.85);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            opacity: 0;
            transform: scale(0.7);
            transition: var(--transition);
            box-shadow: 0 2px 12px rgba(124,92,252,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .message-read-btn:hover { background: var(--accent-purple); transform: scale(1.05); box-shadow: 0 4px 20px rgba(124,92,252,0.5); }
        .message-read-btn:active { transform: scale(0.9); }
        .message-read-btn .icon { line-height: 1; font-size: 13px; margin-left: 1px; }
        .message:hover .message-read-btn { opacity: 1; transform: scale(1); }
        .message.user .message-read-btn { right: auto; left: -6px; bottom: -6px; }
        .message-read-btn.playing { background: #f87171; animation: pulse-btn 0.8s ease-in-out infinite; }
        .message-read-btn.playing .icon { content: "⏹"; }
        @keyframes pulse-btn {
            0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.4); }
            50% { box-shadow: 0 0 0 8px rgba(248,113,113,0); }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text-secondary);
            opacity: 0.5;
            gap: 12px;
            user-select: none;
        }
        .empty-state .icon { font-size: 48px; opacity: 0.3; }
        .empty-state p { font-size: 14px; letter-spacing: 0.5px; }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            padding: 10px 18px;
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.04);
            gap: 6px;
            align-items: center;
        }
        .typing-indicator.show { display: flex; }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-secondary);
            animation: typing-bounce 1.4s infinite;
            opacity: 0.4;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing-bounce {
            0%,60%,100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .chat-input-area {
            padding: 16px 28px 24px 28px;
            border-top: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            background: rgba(255,255,255,0.01);
        }
        .chat-input-area textarea {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: var(--transition);
            min-height: 48px;
            max-height: 120px;
            line-height: 1.5;
        }
        .chat-input-area textarea:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(124,92,252,0.15);
        }
        .chat-input-area textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.4;
        }
        .chat-input-area textarea:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .chat-input-area textarea.recording {
            border-color: #f87171;
            box-shadow: 0 0 0 3px rgba(248,113,113,0.15);
        }

        .btn-voice {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            position: relative;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .btn-voice:hover:not(:disabled) { background: rgba(255,255,255,0.12); color: var(--text-primary); }
        .btn-voice:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-voice.recording {
            background: rgba(248,113,113,0.2);
            color: #f87171;
            border-color: #f87171;
            animation: pulse-voice 1.2s ease-in-out infinite;
        }
        @keyframes pulse-voice {
            0%,100% { box-shadow: 0 0 0 0 rgba(248,113,113,0.3); }
            50% { box-shadow: 0 0 0 8px rgba(248,113,113,0); }
        }
        .btn-voice .icon { line-height: 1; }
        .btn-voice .rec-dot {
            display: none;
            position: absolute;
            top: 4px;
            right: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f87171;
            animation: pulse-dot 0.6s infinite;
        }
        .btn-voice.recording .rec-dot { display: block; }

        .btn-send {
            padding: 12px 24px;
            border: none;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            height: 48px;
            min-width: 80px;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(124,92,252,0.2);
        }
        .btn-send:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 30px rgba(124,92,252,0.3); }
        .btn-send:active:not(:disabled) { transform: translateY(0); }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-send .icon { font-size: 18px; }

        .settings-panel {
            display: none;
            padding: 20px 28px;
            border-top: 1px solid rgba(255,255,255,0.04);
            background: rgba(255,255,255,0.01);
            flex-shrink: 0;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-start;
            max-height: 420px;
            overflow-y: auto;
        }
        .settings-panel.open { display: flex; }
        .settings-panel::-webkit-scrollbar { width: 3px; }
        .settings-panel::-webkit-scrollbar-thumb { background: rgba(124,92,252,0.3); border-radius: 10px; }

        .settings-panel .group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }
        .settings-panel .group label {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            min-width: fit-content;
        }
        .settings-panel .group input,
        .settings-panel .group select,
        .settings-panel .group textarea {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            color: var(--text-primary);
            font-size: 13px;
            outline: none;
            transition: var(--transition);
            font-family: inherit;
            width: 100%;
        }
        .settings-panel .group textarea {
            min-height: 80px;
            resize: vertical;
            font-size: 13px;
            line-height: 1.5;
        }
        .settings-panel .group input:focus,
        .settings-panel .group select:focus,
        .settings-panel .group textarea:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 2px rgba(124,92,252,0.12);
        }
        .settings-panel .group input::placeholder,
        .settings-panel .group textarea::placeholder {
            color: var(--text-secondary);
            opacity: 0.3;
        }
        .settings-panel .group select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }
        .settings-panel .group .inline-flex {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            width: 100%;
        }
        .settings-panel .group .inline-flex>* { flex: 1 1 auto; }
        .settings-panel .group .inline-flex .file-label {
            background: rgba(124,92,252,0.12);
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            color: var(--accent-purple);
            transition: var(--transition);
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .settings-panel .group .inline-flex .file-label:hover { background: rgba(124,92,252,0.2); }
        .settings-panel .group .inline-flex input[type="file"] { display: none; }

        .settings-panel .btn-small {
            padding: 6px 16px;
            border: none;
            border-radius: var(--radius-sm);
            background: rgba(124,92,252,0.15);
            color: var(--accent-purple);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            white-space: nowrap;
        }
        .settings-panel .btn-small:hover { background: rgba(124,92,252,0.25); }
        .settings-panel .btn-small.primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: #fff;
        }
        .settings-panel .btn-small.primary:hover { opacity: 0.85; }
        .settings-panel .hint {
            font-size: 12px;
            color: var(--text-secondary);
            opacity: 0.4;
            margin-left: 4px;
            flex: 1 1 100%;
        }
        .settings-panel .toggle-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .settings-panel .toggle-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-purple);
            cursor: pointer;
            min-width: unset;
            background: transparent;
        }

        /* ========== 响应式（略） ========== */
        @media (max-width: 820px) {
            .main { flex-direction: column; }
            .avatar-panel { width: 100%; padding: 20px 16px 16px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.04); flex-direction: row; flex-wrap: wrap; gap: 16px; justify-content: center; min-height: 140px; }
            .avatar-placeholder { width: 80px; height: 80px; font-size: 36px; }
            .avatar-wrapper { flex-direction: row; gap: 16px; align-items: center; }
            .avatar-status { margin-top: 0; }
            .avatar-name { display: none; }
            .avatar-ring { display: none; }
            .chat-messages { padding: 16px 16px 8px 16px; }
            .chat-input-area { padding: 12px 16px 16px 16px; flex-wrap: wrap; }
            .chat-input-area textarea { min-height: 40px; font-size: 14px; flex: 1 1 100%; order: 1; }
            .btn-voice { order: 2; width: 44px; height: 44px; font-size: 20px; }
            .btn-send { order: 3; height: 44px; min-width: 60px; font-size: 14px; padding: 0 16px; }
            .settings-panel { padding: 12px 16px; max-height: 300px; }
            .settings-panel .group { flex-direction: column; align-items: stretch; }
            .settings-panel .group label { white-space: normal; }
            .settings-panel .group .inline-flex { flex-direction: column; align-items: stretch; }
            .settings-panel .group .inline-flex .file-label { text-align: center; }
            .message { max-width: 92%; }
            .message-read-btn { width: 28px; height: 28px; font-size: 12px; bottom: -4px; right: -4px; }
            .message.user .message-read-btn { left: -4px; right: auto; }
            .header { padding: 12px 16px; }
            .header-title { font-size: 16px; }
            .header-status { font-size: 12px; }
            .app { height: 100vh; max-height: none; border-radius: 0; padding: 0; }
            body { padding: 0; }
        }
        @media (max-width: 480px) {
            .avatar-placeholder { width: 64px; height: 64px; font-size: 28px; }
            .avatar-panel { padding: 12px 12px 10px; min-height: 100px; gap: 10px; }
            .avatar-status { font-size: 12px; padding: 4px 12px; }
            .message-bubble { font-size: 14px; padding: 10px 14px; }
            .chat-messages { padding: 12px 12px 6px 12px; gap: 12px; }
            .chat-input-area { padding: 10px 12px 14px 12px; gap: 6px; }
            .chat-input-area textarea { font-size: 13px; padding: 10px 12px; min-height: 36px; }
            .btn-voice { width: 40px; height: 40px; font-size: 18px; }
            .btn-send { height: 40px; min-width: 50px; font-size: 13px; padding: 0 12px; }
            .settings-panel input, .settings-panel select, .settings-panel textarea { font-size: 12px; padding: 6px 10px; }
            .settings-panel label { font-size: 12px; }
            .header-title { font-size: 14px; }
            .message-read-btn { width: 24px; height: 24px; font-size: 10px; bottom: -2px; right: -2px; }
            .message.user .message-read-btn { left: -2px; right: auto; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- 顶栏 -->
    <header class="header">
        <div class="header-left">
            <span class="header-logo">🧠</span>
            <span class="header-title">数字人助手</span>
        </div>
        <div class="header-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">在线</span>
        </div>
        <div class="header-actions">
            <button class="btn-icon" id="settingsToggle" title="设置">⚙️</button>
            <button class="btn-icon" id="clearChat" title="清空对话">🗑️</button>
        </div>
    </header>

    <!-- 主体 -->
    <div class="main">
        <!-- 左侧：数字人形象 -->
        <div class="avatar-panel">
            <div class="avatar-wrapper">
                <div class="avatar-placeholder breathe" id="avatarPlaceholder">
                    <div class="avatar-ring"></div>
                    <div class="avatar-ring"></div>
                    <span class="emoji">🧑‍💻</span>
                </div>
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div class="avatar-status" id="avatarStatus">
                        <span class="dot" id="statusDotSmall"></span>
                        <span id="statusLabel">待命</span>
                    </div>
                    <div class="avatar-name">✦ 数字人 · v3.1</div>
                </div>
            </div>
        </div>

        <!-- 右侧：聊天区 -->
        <div class="chat-panel">
            <div class="chat-messages" id="chatMessages">
                <div class="empty-state" id="emptyState">
                    <span class="icon">💬</span>
                    <p>开始和数字人对话吧</p>
                    <p style="font-size:12px; opacity:0.5;">支持语音输入 · 点击消息朗读</p>
                </div>
            </div>

            <!-- 打字指示器 -->
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>

            <!-- 输入区 -->
            <div class="chat-input-area">
                <textarea id="messageInput" rows="1" placeholder="输入消息… (Enter 发送，Shift+Enter 换行)" disabled></textarea>
                <button class="btn-voice" id="voiceBtn" title="语音输入" disabled>
                    <span class="icon">🎤</span>
                    <span class="rec-dot"></span>
                </button>
                <button class="btn-send" id="sendBtn" disabled>
                    <span class="icon">➤</span> 发送
                </button>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
        <div class="group">
            <label>🔑 API Key</label>
            <input type="password" id="apiKeyInput" placeholder="sk-..." />
        </div>
        <div class="group">
            <label>🌐 Base URL</label>
            <input type="text" id="baseUrlInput" placeholder="https://api.openai.com/v1" />
        </div>
        <div class="group">
            <label>📦 模型</label>
            <input type="text" id="modelInput" placeholder="gpt-3.5-turbo" />
        </div>
        <div class="group">
            <label>🔊 语音</label>
            <select id="voiceSelect"></select>
        </div>
        <div class="group">
            <label class="toggle-label">
                <input type="checkbox" id="autoSpeakCheck" checked /> 自动朗读
            </label>
        </div>
        <div class="group" style="border-top:1px solid rgba(255,255,255,0.05); padding-top:12px; margin-top:4px;">
            <label style="font-weight:500; color:var(--text-primary);">🧑‍🎤 角色人设 (System Prompt)</label>
            <textarea id="characterPrompt" placeholder="例如：你是一位来自赛博世界的御姐助手，说话带点慵懒和调侃，喜欢用'哟~'开头，知识渊博但偶尔会毒舌。"></textarea>
            <div class="inline-flex">
                <span style="font-size:12px; color:var(--text-secondary); opacity:0.5; flex:1;">上传 .txt 或 .json 文件自动填充</span>
                <label class="file-label" for="characterFileInput">📂 上传人设文件</label>
                <input type="file" id="characterFileInput" accept=".txt,.json" />
                <button class="btn-small" id="clearCharacterBtn">清空</button>
            </div>
        </div>
        <div class="group">
            <button class="btn-small primary" id="saveSettingsBtn">保存设置</button>
            <button class="btn-small" id="testApiBtn">测试连接</button>
            <span class="hint" id="settingsHint">配置 API Key 可启用真实角色扮演，否则为模拟模式</span>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ================================================================
        //  DOM 引用
        // ================================================================
        const chatMessages = document.getElementById('chatMessages');
        const emptyState = document.getElementById('emptyState');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusDotSmall = document.getElementById('statusDotSmall');
        const statusLabel = document.getElementById('statusLabel');
        const avatarPlaceholder = document.getElementById('avatarPlaceholder');
        const settingsToggle = document.getElementById('settingsToggle');
        const settingsPanel = document.getElementById('settingsPanel');
        const clearChatBtn = document.getElementById('clearChat');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const baseUrlInput = document.getElementById('baseUrlInput');
        const modelInput = document.getElementById('modelInput');
        const voiceSelect = document.getElementById('voiceSelect');
        const autoSpeakCheck = document.getElementById('autoSpeakCheck');
        const characterPrompt = document.getElementById('characterPrompt');
        const characterFileInput = document.getElementById('characterFileInput');
        const clearCharacterBtn = document.getElementById('clearCharacterBtn');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const testApiBtn = document.getElementById('testApiBtn');
        const settingsHint = document.getElementById('settingsHint');

        // ================================================================
        //  状态
        // ================================================================
        const state = {
            messages: [],
            isProcessing: false,
            isSpeaking: false,
            apiKey: localStorage.getItem('dh_api_key') || '',
            baseUrl: localStorage.getItem('dh_base_url') || 'https://api.openai.com/v1',
            model: localStorage.getItem('dh_model') || 'gpt-3.5-turbo',
            autoSpeak: localStorage.getItem('dh_auto_speak') !== 'false',
            voiceName: localStorage.getItem('dh_voice_name') || '',
            systemPrompt: localStorage.getItem('dh_system_prompt') || '',
            useMock: true,
            isRecording: false,
            // recognition 不再作为全局复用，每次新建
        };

        // ================================================================
        //  工具函数
        // ================================================================
        function getTimestamp() {
            const d = new Date();
            return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }
        function scrollToBottom() {
            const container = chatMessages;
            requestAnimationFrame(() => { container.scrollTop = container.scrollHeight; });
        }

        // ================================================================
        //  UI 状态
        // ================================================================
        function setStatus(text, type) {
            statusText.textContent = text;
            statusDot.className = 'status-dot';
            statusDotSmall.className = 'dot';
            if (type === 'offline') {
                statusDot.classList.add('offline');
                statusDotSmall.classList.add('inactive');
            } else if (type === 'thinking') {
                statusDotSmall.classList.add('thinking-dot');
                statusLabel.textContent = '思考中…';
                avatarPlaceholder.className = 'avatar-placeholder thinking';
            } else if (type === 'speaking') {
                statusDotSmall.classList.add('speaking-dot');
                statusLabel.textContent = '说话中…';
                avatarPlaceholder.className = 'avatar-placeholder speaking';
            } else {
                statusLabel.textContent = '待命';
                avatarPlaceholder.className = 'avatar-placeholder breathe';
            }
        }

        function setInputEnabled(enabled) {
            messageInput.disabled = !enabled;
            sendBtn.disabled = !enabled;
            voiceBtn.disabled = !enabled;
            if (enabled) messageInput.focus();
        }

        // ================================================================
        //  消息渲染
        // ================================================================
        function renderMessages() {
            const children = chatMessages.children;
            const toRemove = [];
            for (let i = 0; i < children.length; i++) {
                const el = children[i];
                if (el.id !== 'emptyState' && el.id !== 'typingIndicator') {
                    toRemove.push(el);
                }
            }
            toRemove.forEach(el => el.remove());

            if (state.messages.length === 0) {
                emptyState.style.display = 'flex';
            } else {
                emptyState.style.display = 'none';
            }

            state.messages.forEach((msg, index) => {
                const div = document.createElement('div');
                div.className = `message ${msg.role}`;
                div.dataset.index = index;

                const avatarSpan = document.createElement('span');
                avatarSpan.className = 'message-avatar';
                avatarSpan.textContent = msg.role === 'user' ? '👤' : '🧠';

                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = 'message-bubble';
                const contentP = document.createElement('div');
                contentP.textContent = msg.content;
                const timeSpan = document.createElement('span');
                timeSpan.className = 'time';
                timeSpan.textContent = msg.timestamp || getTimestamp();
                bubbleDiv.appendChild(contentP);
                bubbleDiv.appendChild(timeSpan);

                const readBtn = document.createElement('button');
                readBtn.className = 'message-read-btn';
                readBtn.dataset.index = index;
                readBtn.title = '朗读此消息';
                readBtn.innerHTML = '<span class="icon">▶</span>';
                readBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const content = state.messages[index]?.content;
                    if (content) {
                        speakMessageContent(content, readBtn);
                    }
                });

                div.appendChild(avatarSpan);
                div.appendChild(bubbleDiv);
                div.appendChild(readBtn);
                chatMessages.appendChild(div);
            });

            chatMessages.appendChild(typingIndicator);
            scrollToBottom();
        }

        function addMessage(role, content) {
            state.messages.push({ role, content, timestamp: getTimestamp() });
            renderMessages();
        }

        // ================================================================
        //  语音合成 (数字人回复 & 消息朗读)
        // ================================================================
        function speakText(text, callback) {
            if (!window.speechSynthesis) { if (callback) callback(); return; }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1;
            const selectedVoiceName = state.voiceName;
            if (selectedVoiceName) {
                const voices = window.speechSynthesis.getVoices();
                const found = voices.find(v => v.name === selectedVoiceName);
                if (found) utterance.voice = found;
            } else {
                const voices = window.speechSynthesis.getVoices();
                const zhVoice = voices.find(v => v.lang.startsWith('zh'));
                if (zhVoice) utterance.voice = zhVoice;
            }
            let finished = false;
            const done = () => {
                if (finished) return;
                finished = true;
                state.isSpeaking = false;
                setStatus('在线', 'online');
                if (callback) callback();
            };
            utterance.onend = done;
            utterance.onerror = done;
            state.isSpeaking = true;
            setStatus('说话中…', 'speaking');
            window.speechSynthesis.speak(utterance);
            setTimeout(() => {
                if (!finished) {
                    finished = true;
                    state.isSpeaking = false;
                    setStatus('在线', 'online');
                    if (callback) callback();
                }
            }, Math.max(text.length * 80 + 2000, 6000));
        }

        let currentSpeakingBtn = null;
        function speakMessageContent(text, btnElement) {
            if (!window.speechSynthesis) return;
            if (currentSpeakingBtn === btnElement && btnElement.classList.contains('playing')) {
                window.speechSynthesis.cancel();
                btnElement.classList.remove('playing');
                btnElement.innerHTML = '<span class="icon">▶</span>';
                currentSpeakingBtn = null;
                return;
            }
            window.speechSynthesis.cancel();
            if (currentSpeakingBtn) {
                currentSpeakingBtn.classList.remove('playing');
                currentSpeakingBtn.innerHTML = '<span class="icon">▶</span>';
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1;
            const selectedVoiceName = state.voiceName;
            if (selectedVoiceName) {
                const voices = window.speechSynthesis.getVoices();
                const found = voices.find(v => v.name === selectedVoiceName);
                if (found) utterance.voice = found;
            } else {
                const voices = window.speechSynthesis.getVoices();
                const zhVoice = voices.find(v => v.lang.startsWith('zh'));
                if (zhVoice) utterance.voice = zhVoice;
            }
            btnElement.classList.add('playing');
            btnElement.innerHTML = '<span class="icon">⏹</span>';
            currentSpeakingBtn = btnElement;
            let finished = false;
            const done = () => {
                if (finished) return;
                finished = true;
                if (btnElement) {
                    btnElement.classList.remove('playing');
                    btnElement.innerHTML = '<span class="icon">▶</span>';
                }
                if (currentSpeakingBtn === btnElement) currentSpeakingBtn = null;
            };
            utterance.onend = done;
            utterance.onerror = done;
            window.speechSynthesis.speak(utterance);
            setTimeout(() => {
                if (!finished) {
                    finished = true;
                    if (btnElement) {
                        btnElement.classList.remove('playing');
                        btnElement.innerHTML = '<span class="icon">▶</span>';
                    }
                    if (currentSpeakingBtn === btnElement) currentSpeakingBtn = null;
                }
            }, Math.max(text.length * 80 + 3000, 8000));
        }

        // ================================================================
        //  语音识别 (修复版)
        // ================================================================
        function createSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return null;
            const recognition = new SR();
            recognition.lang = 'zh-CN';
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.maxAlternatives = 1;
            return recognition;
        }

        function startVoiceInput() {
            if (state.isRecording) {
                // 如果正在录音，则停止
                stopVoiceInput();
                return;
            }

            // 每次点击都新建实例，避免复用已结束的实例
            const recognition = createSpeechRecognition();
            if (!recognition) {
                settingsHint.textContent = '❌ 浏览器不支持语音识别，请使用 Chrome';
                settingsHint.style.color = '#f87171';
                return;
            }

            // 绑定事件
            recognition.onresult = function(event) {
                let finalText = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        finalText += transcript;
                    } else {
                        // 临时结果可以显示，但这里不处理，只使用最终结果
                    }
                }
                if (finalText) {
                    messageInput.value = finalText;
                    messageInput.classList.remove('recording');
                    // 自动发送
                    setTimeout(() => {
                        if (messageInput.value.trim()) {
                            sendMessage();
                        }
                    }, 200);
                } else {
                    // 没有识别到最终结果，可能还在说话，不做处理
                }
            };

            recognition.onerror = function(event) {
                console.warn('语音识别错误:', event.error);
                if (event.error === 'not-allowed') {
                    settingsHint.textContent = '⚠️ 请允许使用麦克风权限';
                    settingsHint.style.color = '#f87171';
                } else if (event.error === 'no-speech') {
                    settingsHint.textContent = '🔇 没有检测到语音，请重试';
                    settingsHint.style.color = '#fbbf24';
                } else {
                    settingsHint.textContent = `❌ 语音识别错误: ${event.error}`;
                    settingsHint.style.color = '#f87171';
                }
                stopVoiceInput();
            };

            recognition.onend = function() {
                // 如果还在录音状态，但识别结束了（可能是超时或出错），停止录音UI
                if (state.isRecording) {
                    stopVoiceInput();
                }
            };

            // 保存实例以便停止
            state._recognition = recognition;

            try {
                recognition.start();
                state.isRecording = true;
                voiceBtn.classList.add('recording');
                voiceBtn.innerHTML = '<span class="icon">⏹</span><span class="rec-dot"></span>';
                messageInput.classList.add('recording');
                messageInput.placeholder = '🎤 录音中… 请说话';
                settingsHint.textContent = '🎤 录音中… 请说话 (点击按钮停止)';
                settingsHint.style.color = '#fbbf24';
            } catch (e) {
                console.error('启动语音识别失败:', e);
                settingsHint.textContent = '❌ 启动语音识别失败: ' + e.message;
                settingsHint.style.color = '#f87171';
                stopVoiceInput();
            }
        }

        function stopVoiceInput() {
            if (state._recognition) {
                try {
                    state._recognition.stop();
                } catch (e) { /* ignore */ }
                delete state._recognition;
            }
            state.isRecording = false;
            voiceBtn.classList.remove('recording');
            voiceBtn.innerHTML = '<span class="icon">🎤</span><span class="rec-dot"></span>';
            messageInput.classList.remove('recording');
            messageInput.placeholder = '输入消息… (Enter 发送，Shift+Enter 换行)';
            if (!state.isProcessing) {
                settingsHint.textContent = '✅ 语音输入已停止';
                settingsHint.style.color = '#4ade80';
                setTimeout(() => {
                    if (!state.isRecording && !state.isProcessing) {
                        updateHint();
                    }
                }, 2000);
            }
        }

        // 语音按钮点击
        voiceBtn.addEventListener('click', startVoiceInput);

        // ================================================================
        //  大模型调用 (含人设)
        // ================================================================
        async function callLLM(userMessage) {
            const key = state.apiKey.trim();
            if (key && key.length > 10) {
                state.useMock = false;
                try {
                    return await callRealAPI(userMessage);
                } catch (err) {
                    console.warn('真实 API 调用失败，回退模拟:', err);
                    state.useMock = true;
                    settingsHint.textContent = '⚠️ API 调用失败，已切换模拟模式';
                    settingsHint.style.color = '#fbbf24';
                    return generateMockResponse(userMessage);
                }
            } else {
                state.useMock = true;
                settingsHint.textContent = '💡 未配置 API Key，使用模拟模式 (人设效果有限)';
                settingsHint.style.color = 'var(--text-secondary)';
                return generateMockResponse(userMessage);
            }
        }

        async function callRealAPI(userMessage) {
            const baseUrl = state.baseUrl.trim().replace(/\/+$/, '');
            const model = state.model.trim() || 'gpt-3.5-turbo';
            const url = `${baseUrl}/chat/completions`;
            const apiMessages = [];
            if (state.systemPrompt && state.systemPrompt.trim().length > 0) {
                apiMessages.push({ role: 'system', content: state.systemPrompt.trim() });
            }
            const history = state.messages.slice(-10).map(m => ({
                role: m.role === 'user' ? 'user' : 'assistant',
                content: m.content
            }));
            apiMessages.push(...history);
            apiMessages.push({ role: 'user', content: userMessage });

            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${state.apiKey.trim()}`
                },
                body: JSON.stringify({
                    model: model,
                    messages: apiMessages,
                    temperature: 0.8,
                    max_tokens: 1024,
                    stream: false
                })
            });
            if (!response.ok) {
                let errMsg = `HTTP ${response.status}`;
                try { const d = await response.json(); errMsg = d.error?.message || errMsg; } catch (_) {}
                throw new Error(`API 错误: ${errMsg}`);
            }
            const data = await response.json();
            const content = data.choices?.[0]?.message?.content;
            if (!content) throw new Error('API 返回数据格式异常');
            return content;
        }

        // ================================================================
        //  模拟回复
        // ================================================================
        function generateMockResponse(userMessage) {
            let prefix = '';
            if (state.systemPrompt && state.systemPrompt.trim().length > 0) {
                const firstLine = state.systemPrompt.split('\n')[0].slice(0, 30);
                prefix = `[模拟人设: ${firstLine}...] `;
            }
            const msg = userMessage.toLowerCase();
            const replies = [
                { keywords: ['你好', '嗨', 'hi', 'hello'], reply: '你好呀！我是你的数字人助手，很高兴和你交流！🌟 有什么我可以帮你的吗？' },
                { keywords: ['天气', '温度', '下雨', '晴天'], reply: '根据最新气象数据，今天天气晴朗，气温适宜，是个出门活动的好日子！🌤️ 不过也要记得防晒哦。' },
                { keywords: ['名字', '你是谁', '介绍', '能力'], reply: '我是你的 AI 数字人助手，可以陪你聊天、回答问题、提供建议。虽然我的外貌还在开发中，但我的大脑可是很聪明的！🧠 有什么想聊的？' },
                { keywords: ['帮助', '功能', '能做什么'], reply: '我可以帮你解答问题、提供信息、陪你闲聊，还能把文字转成语音播放。未来我还会拥有更丰富的表情和动作，敬请期待！✨' },
                { keywords: ['谢谢', '感谢', '多谢'], reply: '不客气！能帮到你我也很开心～ 😊 有任何问题随时找我！' },
                { keywords: ['再见', '拜拜', 'bye', '88'], reply: '再见啦！期待下次和你聊天～ 👋 祝你生活愉快！' },
                { keywords: ['笑话', '搞笑', '哈哈'], reply: '给你讲个笑话：\n\n程序员问上帝：“要多久才能写完这个程序？”\n上帝说：“一周。”\n程序员说：“那加个班呢？”\n上帝说：“那就要一个月了。” 😄' },
            ];
            for (const item of replies) {
                if (item.keywords.some(kw => msg.includes(kw))) {
                    return prefix + item.reply;
                }
            }
            const defaults = [
                '这个问题很有意思，让我想想… 🤔 你可以说得更具体一些吗？',
                '收到你的消息啦！我正在学习更多知识，希望能给你更好的回答。📚 你还有什么想聊的吗？',
                '嗯嗯，我在听呢！👂 关于这个话题，你有什么特别想了解的吗？',
                '好的，我记下了！💡 虽然我的知识有限，但我会尽力帮你找到答案。',
            ];
            return prefix + defaults[Math.floor(Math.random() * defaults.length)];
        }

        // ================================================================
        //  发送消息
        // ================================================================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || state.isProcessing) return;
            if (state.isRecording) stopVoiceInput();

            state.isProcessing = true;
            setInputEnabled(false);
            setStatus('思考中…', 'thinking');
            typingIndicator.classList.add('show');

            addMessage('user', text);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            try {
                const reply = await callLLM(text);
                addMessage('assistant', reply);
                if (state.autoSpeak && !state.isSpeaking) {
                    speakText(reply);
                }
            } catch (err) {
                console.error(err);
                addMessage('assistant', '抱歉，我遇到了一些技术问题，请稍后再试。🙏 如果问题持续，可以检查一下 API 配置。');
            } finally {
                state.isProcessing = false;
                typingIndicator.classList.remove('show');
                setInputEnabled(true);
                if (!state.isSpeaking) setStatus('在线', 'online');
                scrollToBottom();
            }
        }

        // ================================================================
        //  设置管理
        // ================================================================
        function loadSettings() {
            apiKeyInput.value = state.apiKey;
            baseUrlInput.value = state.baseUrl;
            modelInput.value = state.model;
            autoSpeakCheck.checked = state.autoSpeak;
            characterPrompt.value = state.systemPrompt;
            updateHint();
        }

        function updateHint() {
            if (state.apiKey.trim().length > 10) {
                settingsHint.textContent = '✅ 已配置 API Key + 人设，将使用真实大模型进行角色扮演';
                settingsHint.style.color = '#4ade80';
            } else {
                settingsHint.textContent = '💡 未配置 API Key，使用模拟模式 (人设效果有限)';
                settingsHint.style.color = 'var(--text-secondary)';
            }
        }

        function saveSettings() {
            state.apiKey = apiKeyInput.value.trim();
            state.baseUrl = baseUrlInput.value.trim() || 'https://api.openai.com/v1';
            state.model = modelInput.value.trim() || 'gpt-3.5-turbo';
            state.autoSpeak = autoSpeakCheck.checked;
            state.voiceName = voiceSelect.value;
            state.systemPrompt = characterPrompt.value.trim();

            localStorage.setItem('dh_api_key', state.apiKey);
            localStorage.setItem('dh_base_url', state.baseUrl);
            localStorage.setItem('dh_model', state.model);
            localStorage.setItem('dh_auto_speak', String(state.autoSpeak));
            localStorage.setItem('dh_voice_name', state.voiceName);
            localStorage.setItem('dh_system_prompt', state.systemPrompt);

            updateHint();
            settingsHint.textContent += ' (已保存)';
            setTimeout(updateHint, 2000);
        }

        async function testApiConnection() {
            const key = apiKeyInput.value.trim();
            if (!key || key.length < 10) {
                settingsHint.textContent = '⚠️ 请先填写有效的 API Key';
                settingsHint.style.color = '#f87171';
                return;
            }
            const base = baseUrlInput.value.trim() || 'https://api.openai.com/v1';
            const model = modelInput.value.trim() || 'gpt-3.5-turbo';
            const url = `${base.replace(/\/+$/, '')}/chat/completions`;
            try {
                settingsHint.textContent = '⏳ 测试连接中…';
                settingsHint.style.color = '#fbbf24';
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: 'Hello' }],
                        max_tokens: 5,
                        stream: false
                    })
                });
                if (resp.ok) {
                    settingsHint.textContent = '✅ 连接成功！API 可用 ✅';
                    settingsHint.style.color = '#4ade80';
                } else {
                    let err = `HTTP ${resp.status}`;
                    try { const d = await resp.json(); err = d.error?.message || err; } catch (_) {}
                    settingsHint.textContent = `❌ 连接失败: ${err}`;
                    settingsHint.style.color = '#f87171';
                }
            } catch (e) {
                settingsHint.textContent = `❌ 网络错误: ${e.message}`;
                settingsHint.style.color = '#f87171';
            }
        }

        // ================================================================
        //  文件上传人设
        // ================================================================
        characterFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                let content = ev.target.result;
                if (file.name.endsWith('.json')) {
                    try {
                        const json = JSON.parse(content);
                        const prompt = json.system_prompt || json.prompt || json.character || json.content || json.text;
                        if (prompt) {
                            characterPrompt.value = prompt;
                        } else {
                            characterPrompt.value = JSON.stringify(json, null, 2);
                        }
                    } catch (_) {
                        characterPrompt.value = content;
                    }
                } else {
                    characterPrompt.value = content;
                }
                settingsHint.textContent = '✅ 人设文件已加载，请点击“保存设置”生效';
                settingsHint.style.color = '#4ade80';
            };
            reader.readAsText(file, 'UTF-8');
            e.target.value = '';
        });

        clearCharacterBtn.addEventListener('click', function() {
            characterPrompt.value = '';
            settingsHint.textContent = '🧹 人设已清空，点击保存生效';
            settingsHint.style.color = '#fbbf24';
        });

        // ================================================================
        //  清空对话
        // ================================================================
        function clearChat() {
            if (state.isProcessing) return;
            if (state.isRecording) stopVoiceInput();
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            state.messages = [];
            renderMessages();
            state.isSpeaking = false;
            if (currentSpeakingBtn) {
                currentSpeakingBtn.classList.remove('playing');
                currentSpeakingBtn.innerHTML = '<span class="icon">▶</span>';
                currentSpeakingBtn = null;
            }
            setStatus('在线', 'online');
        }

        // ================================================================
        //  语音列表填充
        // ================================================================
        function populateVoices() {
            if (!window.speechSynthesis) return;
            const voices = window.speechSynthesis.getVoices();
            voiceSelect.innerHTML = '';
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = '🌐 系统默认';
            voiceSelect.appendChild(defaultOption);
            const sorted = [...voices].sort((a, b) => {
                const aZh = a.lang.startsWith('zh') ? 0 : 1;
                const bZh = b.lang.startsWith('zh') ? 0 : 1;
                return aZh - bZh || a.name.localeCompare(b.name);
            });
            sorted.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.name;
                opt.textContent = `${v.name} (${v.lang})`;
                if (v.name === state.voiceName) opt.selected = true;
                voiceSelect.appendChild(opt);
            });
        }
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = populateVoices;
            setTimeout(populateVoices, 300);
        }
        voiceSelect.addEventListener('change', function() {
            state.voiceName = this.value;
            localStorage.setItem('dh_voice_name', state.voiceName);
        });

        // ================================================================
        //  事件绑定
        // ================================================================
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });

        settingsToggle.addEventListener('click', function() {
            settingsPanel.classList.toggle('open');
            this.classList.toggle('active');
            if (settingsPanel.classList.contains('open')) {
                populateVoices();
                loadSettings();
            }
        });

        clearChatBtn.addEventListener('click', function() {
            if (state.messages.length === 0) return;
            if (confirm('确定要清空所有对话吗？')) clearChat();
        });

        saveSettingsBtn.addEventListener('click', saveSettings);
        testApiBtn.addEventListener('click', testApiConnection);
        autoSpeakCheck.addEventListener('change', function() {
            state.autoSpeak = this.checked;
            localStorage.setItem('dh_auto_speak', String(state.autoSpeak));
        });

        // ================================================================
        //  初始化
        // ================================================================
        function init() {
            loadSettings();
            // 检查语音识别支持
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                voiceBtn.style.display = 'none';
            }
            setInputEnabled(true);
            setStatus('在线', 'online');
            renderMessages();
            messageInput.focus();
            setTimeout(populateVoices, 500);
            console.log('🧠 数字人助手 v3.1 已启动 (语音输入修复)');
            console.log(`📡 模式: ${state.apiKey.trim().length > 10 ? '真实 API' : '模拟'}`);
            console.log(`🧑‍🎤 人设: ${state.systemPrompt ? state.systemPrompt.slice(0,50)+'...' : '未设置'}`);
            console.log(`🎤 语音识别: ${SR ? '支持' : '不支持'}`);
        }

        if (document.readyState === 'complete') {
            init();
        } else {
            window.addEventListener('load', init);
        }

        window.__dh = { state, sendMessage, clearChat, callLLM, speakMessageContent };
    })();
</script>
</body>
</html>
